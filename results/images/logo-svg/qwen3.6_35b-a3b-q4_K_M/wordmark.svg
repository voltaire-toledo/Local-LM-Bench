<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .text { fill: #ffffff; font-family: 'Arial Black', Impact, sans-serif; font-weight: bold; font-size: 72px; letter-spacing: 4px; }
      .accent { fill: #00d4ff; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="512" height="512" rx="40"/>
  
  <!-- Decorative geometric elements -->
  <circle class="accent" cx="60" cy="80" r="30" opacity="0.8"/>
  <circle class="accent" cx="450" cy="430" r="20" opacity="0.6"/>
  
  <!-- Abstract wind/north arrow element -->
  <path d="M 256 120 L 276 180 L 256 160 L 236 180 Z" class="accent" opacity="0.9"/>
  <path d="M 256 140 L 266 170 L 256 160 L 246 170 Z" fill="#ffffff" opacity="0.5"/>
  
  <!-- Horizontal accent line -->
  <rect class="accent" x="180" y="380" width="152" height="4" rx="2"/>
  
  <!-- Wordmark: NORTHWIND -->
  <text class="text" x="50%" y="55%" dominant-baseline="middle" text-anchor="middle">NORTHWIND</text>
  
  <!-- Subtitle/Tagline element -->
  <rect class="accent" x="216" y="400" width="80" height="3" rx="1.5"/>
  
  <!-- Corner accents -->
  <path d="M 40 40 L 70 40 L 70 50 L 50 50 L 50 70 L 40 70 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M 472 472 L 442 472 L 442 462 L 462 462 L 462 442 L 472 442 Z" fill="#ffffff" opacity="0.3"/>
  
  <!-- Small geometric dots -->
  <circle class="accent" cx="100" cy="450" r="4" opacity="0.7"/>
  <circle class="accent" cx="420" cy="60" r="4" opacity="0.7"/>
  <circle class="accent" cx="380" cy="480" r="3" opacity="0.5"/>
  <circle class="accent" cx="130" cy="50" r="3" opacity="0.5"/>
</svg>