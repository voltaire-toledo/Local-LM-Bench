  <!-- Ears -->
  <path d="M200 140 C180 100, 220 80, 230 140 Z" fill="#E67E22"/>
  <path d="M312 140 C332 100, 292 80, 282 140 Z" fill="#E67E22"/>
  
  <!-- Inner ears -->
  <ellipse cx="215" cy="130" rx="20" ry="15" fill="#F39C12"/>
  <ellipse cx="297" cy="130" rx="20" ry="15" fill="#F39C12"/>
  
  <!-- Eyes -->
  <circle cx="230" cy="190" r="12" fill="#2C3E50"/>
  <circle cx="282" cy="190" r="12" fill="#2C3E50"/>
  <circle cx="230" cy="190" r="5" fill="#ECF0D1"/>
  <circle cx="282" cy="190" r="5" fill="#ECF0D1"/>
  
  <!-- Nose -->
  <path d="M256 210 C245 220, 267 220, 256 210 Z" fill="#F39C12"/>
  
  <!-- Mouth -->
  <path d="M245 230 Q256 240, 267 230" stroke="#2C3E50" stroke-width="3" fill="none"/>
  
  <!-- Whiskers -->
  <path d="M230 220 L200 225" stroke="#2C3E50" stroke-width="2"/>
  <path d="M282 220 L312 225" stroke="#2C3E50" stroke-width="2"/>
  <path d="M230 230 L200 235" stroke="#2C3E50" stroke-width="2"/>
  <path d="M282 230 L312 235" stroke="#2C3E50" stroke-width="2"/>
  
  <!-- Tail -->
  <path d="M130 320 C80 280, 60 380, 120 400 C150 410, 180 380, 160 340 C140 300, 110 300, 130 320 Z" fill="#E67E22"/>
  
  <!-- Tail highlight -->
  <path d="M140 330 C100 300, 90 360, 130 380 C150 385, 170 360, 150 330 C130 300, 110 300, 140 330 Z" fill="#F39C12"/>
  
  <!-- Legs -->
  <ellipse cx="180" cy="380" rx="20" ry="15" fill="#E67E22"/>
  <ellipse cx="332" cy="380" rx="20" ry="15" fill="#E67E22"/>
  <ellipse cx="150" cy="380" rx="15" ry="12" fill="#E67E22"/>
  <ellipse cx="362" cy="380" rx="15" ry="12" fill="#E67E22"/>
  
  <!-- Paws -->
